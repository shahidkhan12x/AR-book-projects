<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Book</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/1.6.1/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
        <!-- This is where we define the AR marker -->
        <a-marker preset="hiro">
             <a-video 
          src="engine.mp4" 
          width="0.6"   <!-- Adjusted width to be smaller -->
          height="0.4"  <!-- Adjusted height to be smaller -->
          position="0 0 0" 
          rotation="-90 0 0" 
          autoplay="true" 
          loop="true">
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
